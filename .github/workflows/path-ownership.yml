name: path-ownership
on:
  pull_request:
# The token every job gets can read the code and nothing else.
permissions:
  contents: read
jobs:
  path-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The path ownership script lands in Wave 2 (deploy-and-docs); until then this job passes.
      - run: echo "path ownership check lands in Wave 2"
