name: daily-live-self-test
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_MIGRATE: postgres://app_migrate:ci-only-password@localhost:5432/meet_first
      DATABASE_URL_WORKER: postgres://app_worker:ci-only-password@localhost:5432/meet_first
      META_API_BASE_URL: https://api.meta.ai/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:fresh
      - name: Live self-test against the model API
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: LLM_MODE=live pnpm --filter @meet-first/worker self-test
