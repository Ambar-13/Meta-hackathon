# The Oracle server (deploy/oracle/README.md): Postgres, the api, the worker and Caddy on one machine. The api applies the
# migrations before it listens, as Render's pre-deploy command does (D71), and the worker starts only once the api answers,
# so it never boots on an old schema. The ${...} values come from /opt/meet-first/.env on the server, which deploy.sh writes.
name: meet-first

x-logs: &logs
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD:?}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./make-roles.sh:/docker-entrypoint-initdb.d/10-make-roles.sh:ro
    # Open to the server itself only, for the production check through an SSH tunnel; never to the internet.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      # Over TCP: while the first start runs make-roles.sh, Postgres listens on its socket only, so this waits for the roles.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    build: { context: ../.., dockerfile: Dockerfile.api }
    restart: unless-stopped
    logging: *logs
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "pnpm -w db:migrate && exec node --import tsx src/server.ts"]
    environment:
      DATABASE_URL_MIGRATE: postgresql://app_migrate:${APP_MIGRATE_PASSWORD}@postgres:5432/meet_first
      DATABASE_URL_API: postgresql://app_api:${APP_API_PASSWORD}@postgres:5432/meet_first
      APP_ORIGIN: ${APP_ORIGIN:?}
      PORT: "3000"
      MAX_CONCURRENT_MEETINGS: "40"
      LOG_LEVEL: info
      NODE_ENV: production
    # A 120 s model call can still be draining when a deploy stops the container (D39, D70).
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  worker:
    build: { context: ../.., dockerfile: Dockerfile.worker }
    restart: unless-stopped
    logging: *logs
    depends_on:
      api: { condition: service_healthy }
    environment:
      DATABASE_URL_WORKER: postgresql://app_worker:${APP_WORKER_PASSWORD}@postgres:5432/meet_first
      META_API_KEY: ${META_API_KEY:?}
      META_API_BASE_URL: https://api.meta.ai/v1
      LLM_MODE: live
      DAILY_USD_CAP: "40"
      TOTAL_USD_CAP: "130"
      MAX_CONCURRENT_MEETINGS: "40"
      LOG_LEVEL: info
      NODE_ENV: production
    stop_grace_period: 150s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logs
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  caddy-data:
  caddy-config:
