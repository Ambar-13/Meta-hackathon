# One web service runs the api and the worker (scripts/start-api-and-worker.sh) beside Postgres, both on paid plans, so the
# service never sleeps and the database does not expire. Auto-deploy is off; scripts/release.sh deploys the commit of a tag on the
# release branch through the service's one deploy hook. The start script migrates, so a deploy that starts while Postgres restarts
# fails and Render keeps the running instance: change one plan at a time. Two paid services: see git history.
services:
  - type: web
    name: meet-first
    runtime: docker
    plan: 1c-2g              # 1 CPU, 2 GB ($25 a month); 0.5c-512mb ($7 a month) has 0.5 CPU and 512 MB
    region: singapore        # close to the people using it; latency to api.meta.ai is not measured
    dockerfilePath: ./Dockerfile.render   # the whole workspace; starts as root so the api and the worker run as two users
    dockerContext: .
    dockerCommand: bash /app/scripts/start-api-and-worker.sh   # migrations, then the api and the worker (D71)
    autoDeployTrigger: "off"   # D70, R12.3
    healthCheckPath: /api/health        # R12.5
    maxShutdownDelaySeconds: 150   # a model call can finish before a deploy stops the service
    envVars:
      - key: DATABASE_URL_MIGRATE
        sync: false          # from pnpm db:render-roles; the start script gives it to the migrate step only (as-built item 9)
      - key: DATABASE_URL_API
        sync: false          # role app_api; the api process only
      - key: DATABASE_URL_WORKER
        sync: false          # role app_worker; the worker process only
      - key: APP_ORIGIN
        sync: false          # https://heymeety.com; a page on the onrender.com address moves there (A7)
      - key: META_API_KEY
        sync: false          # the worker process only; the start script keeps it out of the api
      - key: ACCESS_CODE
        sync: false          # sign-up needs this code, so scripts cannot make accounts and spend the model budget (R9.5); the api process only
      - key: GOOGLE_CLIENT_ID
        sync: false          # the Google sign-in client of the Meety project in Google Cloud; Continue with Google shows only when both are set
      - key: GOOGLE_CLIENT_SECRET
        sync: false          # set only in Render's settings, never in the repo
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: LLM_MODE
        value: live          # D74: production refuses replay
      - key: DAILY_USD_CAP
        value: "15"          # D60, lowered on 2 Nov 2026 so a leaked access code cannot spend a day's credit fast
      - key: TOTAL_USD_CAP
        value: "111"         # at most $111 of the Meta credit in all
      - key: MAX_CONCURRENT_MEETINGS
        value: "5"           # D57, set for 512 MB, where one meeting took both processes to 368 MB (28 Oct); 2 GB is not yet measured
      - key: DATABASE_DISK_BYTES
        value: "1000000000"  # the database's 1 GB, which /api/health measures against; a bigger disk needs its own size here
      - key: SEED_SAMPLES
        value: "1"           # the six sample people of Explore, added once by the start script; "0" stops adding them
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
databases:
  - name: meet-first-db
    plan: 0.1c-256mb         # 1 GB (DATABASE_DISK_BYTES above), $6 a month, with backups, and it does not expire
    postgresMajorVersion: "16"
    region: singapore
