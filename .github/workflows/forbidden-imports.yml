name: forbidden-imports
on:
  pull_request:
  push:
    branches: [main]
# The token every job gets can read the code and nothing else.
permissions:
  contents: read
jobs:
  forbidden-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: no mock-api anywhere (D74, R13.3)
        run: '! grep -rn "mock-api" apps packages'
      - name: META_API_KEY and the model client stay in the worker (ARCHITECTURE.md 8)
        run: '! grep -rln "META_API_KEY" apps/web apps/api && ! grep -rln "@meet-first/llm" apps/web apps/api'
      - name: LLM_MODE only in packages/llm and the env schema (check-wave-3)
        run: '! grep -rln "LLM_MODE" apps packages | grep -v "^packages/llm/" | grep -v "packages/contracts/src/operations/env" | grep -v "packages/evals/"'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: constants carry row ids (R13.5)
        run: pnpm tsx scripts/constants-name-rows.ts
