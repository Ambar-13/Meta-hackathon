# One web service runs the api and the worker (scripts/start-api-and-worker.sh) beside Postgres,
# on Render's free plans, because Render has no free background worker. Auto-deploy is off; scripts/release.sh deploys the commit
# of a tag on the release branch through the service's one deploy hook. Limits are Render's on 2026-10-28 (render.com/docs/free,
# render.com/docs/blueprint-spec): a free web service sleeps after 15 minutes with no visits and has no pre-deploy command, so the
# start script migrates; the free database holds 1 GB and expires 30 days after it is made. Two paid services: see git history.
services:
  - type: web
    name: meet-first
    runtime: docker
    plan: free               # 0.1 CPU, 512 MB; 0.5c-512mb ($7 a month) never sleeps and has 0.5 CPU
    region: singapore        # close to the people using it; latency to api.meta.ai is not measured
    dockerfilePath: ./Dockerfile.render   # the whole workspace; starts as root so the api and the worker run as two users
    dockerContext: .
    dockerCommand: bash /app/scripts/start-api-and-worker.sh   # migrations, then the api and the worker (D71)
    autoDeployTrigger: "off"   # D70, R12.3
    healthCheckPath: /api/health        # R12.5
    # No maxShutdownDelaySeconds: Render refuses it on free services, so a deploy stops the service after Render's default
    # wait, and a model call longer than that can be cut. On a paid plan, set it to 150.
    envVars:
      - key: DATABASE_URL_MIGRATE
        sync: false          # from pnpm db:render-roles; the start script gives it to the migrate step only (as-built item 9)
      - key: DATABASE_URL_API
        sync: false          # role app_api; the api process only
      - key: DATABASE_URL_WORKER
        sync: false          # role app_worker; the worker process only
      - key: APP_ORIGIN
        sync: false          # https://<service>.onrender.com until a domain exists (A7)
      - key: META_API_KEY
        sync: false          # the worker process only; the start script keeps it out of the api
      - key: ACCESS_CODE
        sync: false          # sign-up needs this code, so scripts cannot make accounts and spend the model budget (R9.5); the api process only
      - key: GOOGLE_CLIENT_ID
        sync: false          # the Google sign-in client of the Meety project in Google Cloud; Continue with Google shows only when both are set
      - key: GOOGLE_CLIENT_SECRET
        sync: false          # set only in Render's settings, never in the repo
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: LLM_MODE
        value: live          # D74: production refuses replay
      - key: DAILY_USD_CAP
        value: "15"          # D60, lowered on 2 Nov 2026 so a leaked access code cannot spend a day's credit fast
      - key: TOTAL_USD_CAP
        value: "111"         # at most $111 of the Meta credit in all
      - key: MAX_CONCURRENT_MEETINGS
        value: "5"           # D57, lowered: both processes share 512 MB, and one meeting took them to 368 MB together (28 Oct)
      - key: SEED_SAMPLES
        value: "1"           # the six sample people of Explore, added once by the start script; "0" stops adding them
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
databases:
  - name: meet-first-db
    plan: free               # 1 GB, expires 30 days after it is made; 0.1c-256mb ($6 a month) keeps it
    postgresMajorVersion: "16"
    region: singapore
