name: forbidden-imports
on:
  pull_request:
  push:
    branches: [main]
# The token every job gets can read the code and nothing else.
permissions:
  contents: read
jobs:
  forbidden-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: no mock-api anywhere
        run: '! grep -rn "mock-api" apps packages'
      - name: META_API_KEY and the model client stay in the worker
        run: '! grep -rln "META_API_KEY" apps/web apps/api && ! grep -rln "@meet-first/llm" apps/web apps/api'
      - name: LLM_MODE only in packages/llm and the env schema
        run: '! grep -rln "LLM_MODE" apps packages | grep -v "^packages/llm/" | grep -v "packages/contracts/src/operations/env" | grep -v "packages/evals/"'
