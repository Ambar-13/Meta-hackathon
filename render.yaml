# D70: two production services plus Postgres, auto-deploy off, deploys only through the hooks that scripts/release.sh calls with the commit of a tag.
# Plan IDs and prices are Render's on 2026-10-28 (render.com/docs/blueprint-spec, render.com/pricing); the sizes are the Wave 0 defaults.
services:
  - type: web
    name: meet-first-api
    runtime: docker
    plan: 0.5c-512mb         # 0.5 CPU, 512 MB, $7 a month, a paid instance (ARCHITECTURE.md 9) [confirm]
    region: singapore        # ARCHITECTURE.md 12: availability and latency to api.meta.ai are unverified [confirm]
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: "off"   # D70, R12.3
    preDeployCommand: pnpm -w db:migrate   # D71, R12.1: only the api migrates, under pg_advisory_lock(42). -w runs the root script:
                                           # the image's working directory is apps/api, where pnpm 9.12 finds no db:migrate
    healthCheckPath: /api/health        # R12.5
    maxShutdownDelaySeconds: 150        # D70, R12.4: SIGTERM waits long enough to drain a 120 s model call
    envVars:
      - key: DATABASE_URL_MIGRATE
        sync: false          # the app_migrate URL from pnpm db:render-roles, never the database owner's: migrations run as app_migrate (as-built item 9),
                             # and Render gives the pre-deploy command the service's variables, so whatever is here is also in the api's environment
      - key: DATABASE_URL_API
        sync: false          # same host and database, role app_api; pnpm db:render-roles makes the role and writes this URL
      - key: APP_ORIGIN
        sync: false          # https://<service>.onrender.com until a domain exists (A7)
      - key: MAX_CONCURRENT_MEETINGS
        value: "40"          # D57
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
  - type: worker
    name: meet-first-worker
    runtime: docker
    plan: 0.5c-512mb         # always on (ARCHITECTURE.md 2); 0.5 CPU, 512 MB, $7 a month [confirm]
    region: singapore
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 150   # drain a 120 s model call (D39)
    envVars:
      - key: DATABASE_URL_WORKER
        sync: false          # role app_worker
      - key: META_API_KEY
        sync: false
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1   # ARCHITECTURE.md 2
      - key: LLM_MODE
        value: live          # D74: production refuses replay
      - key: DAILY_USD_CAP
        value: "40"          # D60
      - key: TOTAL_USD_CAP
        value: "130"         # D60
      - key: MAX_CONCURRENT_MEETINGS
        value: "40"
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
databases:
  - name: meet-first-db
    plan: 0.1c-256mb         # 0.1 CPU, 256 MB, $6 a month, plus $0.30 per GB of disk (15 GB by default); the health route reports degraded at 80% [confirm]
    postgresMajorVersion: "16"
    region: singapore
